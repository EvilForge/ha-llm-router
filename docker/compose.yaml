name: aiserver

services:
  ollama:
    volumes:
      - /containers/volumes/ollama:/root/.ollama
    container_name: ollama
    pull_policy: always
    tty: true
    environment:
      - OLLAMA_DEBUG=0
    networks:
      - proxy
    restart: unless-stopped
    image: ollama/ollama:latest
    ports:
      - 11434:11434
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  ha-llm-router:
    build:
      context: /containers/volumes/ha-llm-router
      dockerfile: Dockerfile
    container_name: ha-llm-router
    restart: unless-stopped
    ports:
      - "8088:8088"
    env_file:
      - /containers/volumes/ha-llm-router/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - proxy

networks:
  proxy:
    external: true
